name = "lista-azul"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Base de datos (comentarios, votaciones y textos).
# Sin "id": Wrangler la crea solo en el primer deploy.
# Si tu versión no lo hace, creala (Workers > KV) y agregá: id = "EL_ID"
[[kv_namespaces]]
binding = "LISTA_DB"
